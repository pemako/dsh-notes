name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Package the release without publishing it
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the released tag
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show the toolchain
        run: |
          node --version
          npm --version

      - name: Check the tag against the package version
        run: |
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            echo "not a tag ref ($GITHUB_REF_TYPE $GITHUB_REF_NAME); skipping the tag check"
            exit 0
          fi
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          echo "tag=$tag package=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::release tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - name: Check the client bundle parses
        run: node --check client.js

      - name: Show what would be published
        run: npm pack --dry-run

      - name: Publish to npm
        if: github.event_name == 'release' || inputs.dry_run == false
        run: npm publish --registry https://registry.npmjs.org/ --access public --provenance
